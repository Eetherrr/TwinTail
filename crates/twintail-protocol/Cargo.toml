[package]
name = "twintail-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
