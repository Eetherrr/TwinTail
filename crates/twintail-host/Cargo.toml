[package]
name = "twintail-host"
default-run = "twintail-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "TwinTail minimal plugin host"

[dependencies]
tokio.workspace = true
serde_json = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tempfile = "3"
twintail-protocol = { path = "../twintail-protocol" }
twintail-core = { path = "../twintail-core" }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
interprocess = { version = "=2.4.7", features = ["tokio"] }
winsafe = { version = "0.0.29", features = ["advapi"] }
widestring = "1"
