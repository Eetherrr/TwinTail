[package]
name = "twintail-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.33", default-features = false }
sha2 = "0.10"
tempfile = "3"
schemars = "1"
toml = "0.9"
semver = "1"
tokio = { version = "1", features = ["io-util", "process", "sync", "time", "rt", "macros", "fs"] }
twintail-protocol = { path = "../twintail-protocol" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
