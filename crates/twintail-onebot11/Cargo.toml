[package]
name = "twintail-onebot11"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
twintail-protocol = { path = "../twintail-protocol" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
