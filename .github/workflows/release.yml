name: Release candidates

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to validate, e.g. v0.1.0 (build only; never publishes)'
        required: true
        type: string

permissions:
  contents: read

# Never cancel a publication halfway through uploading its assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release identity
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate tag against source manifests
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          python tools/release/automation.py validate --tag "$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  checks:
    name: Full source validation
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  package:
    name: Package / ${{ matrix.target }}
    needs: [version, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            triple: x86_64-unknown-linux-gnu
            extension: tar.gz
          - os: ubuntu-24.04-arm
            target: linux-aarch64
            triple: aarch64-unknown-linux-gnu
            extension: tar.gz
          - os: windows-latest
            target: windows-x86_64
            triple: x86_64-pc-windows-msvc
            extension: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_TRIPLE: ${{ matrix.triple }}
      RELEASE_EXTENSION: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Build release binaries on native runner
        run: python tools/release/release.py build --target "$RELEASE_TARGET"
      - name: Smoke test packaged host binary
        run: |
          suffix=""
          if [ "$RUNNER_OS" = Windows ]; then suffix=".exe"; fi
          "target/$RELEASE_TRIPLE/release/twintail-host$suffix" --version
          "target/$RELEASE_TRIPLE/release/twintail-host$suffix" --check
      - name: Stage and verify platform archive
        run: |
          version="${RELEASE_TAG#v}"
          archive="twintail-$version-$RELEASE_TARGET.$RELEASE_EXTENSION"
          mkdir release-artifact
          python tools/release/release.py stage --target "$RELEASE_TARGET" --binaries "target/$RELEASE_TRIPLE/release" --output release-stage
          python tools/release/release.py verify release-stage
          python tools/release/release.py archive --stage release-stage --output "release-artifact/$archive"
          python tools/release/release.py verify "release-artifact/$archive" > release-artifact/validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.target }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Collect and optionally create draft
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: candidate-linux-x86_64
          path: candidates/linux-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: candidate-linux-aarch64
          path: candidates/linux-aarch64
      - uses: actions/download-artifact@v4
        with:
          name: candidate-windows-x86_64
          path: candidates/windows-x86_64
      - name: Verify all platforms and collect download checksums
        run: python tools/release/automation.py collect --artifacts candidates --output release-output --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-review-bundle
          path: release-output/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Create draft and publish if explicitly approved (tag only)
    needs: [version, draft]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-review-bundle
          path: release-output
      - name: Inspect remote tag and explicit publication approval
        id: approval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # Resolve lightweight and annotated remote tags before associating downloads with a source SHA.
          python - <<'PY'
          import json, os, urllib.request
          from urllib.parse import quote
          base = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          def get(path):
              request = urllib.request.Request(base + path, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          obj = get('/git/ref/tags/' + quote(os.environ['RELEASE_TAG'], safe=''))['object']
          approved = False
          for depth in range(16):
              if obj['type'] != 'tag':
                  break
              tag = get('/git/tags/' + obj['sha'])
              if depth == 0:
                  approved = 'TwinTail-Publish: approved' in tag['message'].split('\n')
              obj = tag['object']
          if obj['type'] != 'commit' or obj['sha'] != os.environ['SOURCE_COMMIT']:
              raise SystemExit('Remote tag no longer matches the tested source commit; publication stopped.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('publish=' + str(approved).lower() + '\n')
          PY
      - name: Create new GitHub Release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # Preserve existing releases and assets: reruns never overwrite v0.1.0 or another publication.
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          from urllib.parse import quote
          url = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY'] + '/releases/tags/' + quote(os.environ['RELEASE_TAG'], safe='')
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              raise SystemExit('Release already exists; inspect it manually. No assets were overwritten.')
          PY
          gh release create "$RELEASE_TAG" release-output/* --verify-tag --target "$SOURCE_COMMIT" --draft --title "TwinTail $RELEASE_TAG" --notes-file release-output/release-notes.md
      - name: Verify uploaded draft bytes and publish approved tag
        if: steps.approval.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # Every check precedes the only public mutation; failures leave the new release draft.
          python - <<'PY'
          import filecmp, json, os, pathlib, subprocess, tempfile, urllib.request
          from urllib.parse import quote
          tag_name = os.environ['RELEASE_TAG']
          source = os.environ['SOURCE_COMMIT']
          base = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          def get(path):
              request = urllib.request.Request(base + path, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          def require(condition, message):
              if not condition:
                  raise SystemExit(message)
          version = tag_name.removeprefix('v')
          targets = ('linux-x86_64', 'linux-aarch64', 'windows-x86_64')
          expected = {'SHA256SUMS', 'release-notes.md'}
          expected.update(target + '-validation.json' for target in targets)
          expected.update('twintail-' + version + '-' + target + ('.zip' if target.startswith('windows-') else '.tar.gz') for target in targets)
          local = pathlib.Path('release-output').resolve()
          def files(directory):
              entries = list(directory.iterdir())
              require(all(path.is_file() and not path.is_symlink() for path in entries), 'Unexpected non-regular release asset.')
              return {path.name for path in entries}
          require(files(local) == expected, 'Review bundle does not contain exactly the eight expected assets.')
          def find_release():
              # Draft discovery must use LIST. target_commitish is descriptive metadata,
              # not the current commit behind an existing tag; the remote tag is checked below.
              matches = []
              for page in range(1, 21):
                  releases = get('/releases?per_page=100&page=' + str(page))
                  matches.extend(release for release in releases if release['tag_name'] == tag_name)
                  if len(releases) < 100:
                      break
              else:
                  raise SystemExit('Release inventory exceeded the bounded lookup.')
              require(len(matches) == 1, 'Expected exactly one release for the approved tag.')
              return matches[0]
          def verify_draft():
              release = find_release()
              require(release['draft'] is True and release['tag_name'] == tag_name, 'Draft tag differs from approved tag.')
              assets = release['assets']
              require(len(assets) == len(expected) and {asset['name'] for asset in assets} == expected, 'Draft asset set differs from review bundle.')
              require(all(asset['state'] == 'uploaded' and asset['size'] == (local / asset['name']).stat().st_size for asset in assets), 'Draft asset upload incomplete or size mismatch.')
              return release
          draft = verify_draft()
          release_id = draft['id']
          with tempfile.TemporaryDirectory(prefix='twintail-release-') as temporary:
              downloaded = pathlib.Path(temporary)
              for asset in draft['assets']:
                  with (downloaded / asset['name']).open('xb') as output:
                      subprocess.run(['gh', 'api', 'repos/' + os.environ['GH_REPO'] + '/releases/assets/' + str(asset['id']), '-H', 'Accept: application/octet-stream'], stdout=output, check=True)
              require(files(downloaded) == expected, 'Downloaded asset set differs from review bundle.')
              for name in expected:
                  require(filecmp.cmp(local / name, downloaded / name, shallow=False), 'Uploaded asset bytes differ: ' + name)
              # Require precisely seven checksum entries before allowing sha256sum to open paths.
              for directory in (local, downloaded):
                  lines = (directory / 'SHA256SUMS').read_text(encoding='ascii').splitlines()
                  checksummed = set()
                  for line in lines:
                      digest, separator, name = line[:64], line[64:66], line[66:]
                      require(len(digest) == 64 and all(c in '0123456789abcdef' for c in digest) and separator == '  ' and name in expected - {'SHA256SUMS'} and name not in checksummed, 'Invalid or unexpected checksum entry.')
                      checksummed.add(name)
                  require(checksummed == expected - {'SHA256SUMS'}, 'Checksum inventory differs from expected assets.')
                  subprocess.run(['sha256sum', '--strict', '--check', 'SHA256SUMS'], cwd=directory, check=True)
          # Recheck remote approval/commit and release identity after downloading; protect tags in repository settings.
          obj = get('/git/ref/tags/' + quote(tag_name, safe=''))['object']
          require(obj['type'] == 'tag', 'Public publication requires a top-level annotated tag.')
          for depth in range(16):
              if obj['type'] != 'tag':
                  break
              annotation = get('/git/tags/' + obj['sha'])
              if depth == 0:
                  require('TwinTail-Publish: approved' in annotation['message'].split('\n'), 'Top-level publication approval is no longer present.')
              obj = annotation['object']
          require(obj['type'] == 'commit' and obj['sha'] == source, 'Remote tag no longer matches the tested source commit.')
          require(verify_draft()['id'] == release_id, 'Draft release identity changed during verification.')
          subprocess.run(['gh', 'api', '--method', 'PATCH', 'repos/' + os.environ['GH_REPO'] + '/releases/' + str(release_id), '-F', 'draft=false', '-f', 'make_latest=true'], check=True)
          PY
