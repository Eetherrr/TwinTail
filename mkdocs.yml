site_name: TwinTail
site_description: 用 Rust 开发 QQ 机器人，安装插件、管理功能，从运行示例到编写自己的插件。
site_url: https://Eetherrr.github.io/TwinTail/
repo_url: https://github.com/Eetherrr/TwinTail
repo_name: Eetherrr/TwinTail
edit_uri: edit/main/docs/
strict: true
hooks:
  - tools/docs/hooks.py

theme:
  name: material
  language: zh
  font: false
  icon:
    logo: material/cat
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - scheme: slate
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.action.view
    - content.code.copy
plugins:
  - search:
      lang:
        - zh
        - en
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_css:
  - stylesheets/extra.css
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn

nav:
  - 首页: index.md
  - 用户指南:
      - 无账号快速开始: plugin-api/quickstart.md
      - Web 管理与 CLI 救援: plugin-api/web-admin.md
      - SnowLuma 接入: plugin-api/adapters.md
      - 运维与冷备恢复: release/operations.md
      - 错误诊断: plugin-api/troubleshooting.md
  - 开发者:
      - 插件开发从这里开始: plugin-api/README.md
      - 从零写第一个插件: plugin-api/first-plugin.md
      - SDK API 详细参考: plugin-api/sdk-reference.md
      - 插件信息与启动配置: plugin-api/manifest.md
      - 插件和宿主如何通信: plugin-api/protocol.md
      - 启动、停止与回调: plugin-api/lifecycle.md
      - 事件: plugin-api/events.md
      - 动作: plugin-api/actions.md
      - 服务: plugin-api/services.md
      - 权限: plugin-api/permissions.md
      - 读取和修改插件配置: plugin-api/configuration.md
      - 安装、数据与彻底移除: plugin-api/storage.md
      - 不重启宿主更换插件: plugin-api/hot-reload.md
      - 返回错误时怎么办: plugin-api/errors.md
      - 迁移: plugin-api/migration.md
      - 合同与有界负载工具: plugin-api/contract-tools.md
  - 架构:
      - 架构索引: architecture/README.md
      - 安全边界: architecture/security.md
      - 'ADR 0001 · P0 基线': architecture/0001-p0-baseline.md
      - 'ADR 0002 · P1 插件宿主': architecture/0002-p1-plugin-host.md
      - 'ADR 0003 · P2 SDK 与路由': architecture/0003-p2-sdk-routing.md
      - 'ADR 0004 · P3 管理与重载': architecture/0004-p3-management-config-reload.md
      - 'ADR 0005 · P4 OneBot 与 SnowLuma': architecture/0005-p4-onebot-snowluma.md
      - 'ADR 0006 · P5 Web 管理': architecture/0006-p5-web-admin.md
      - 'ADR 0007 · P6 发布加固': architecture/0007-p6-release-hardening.md
      - 'ADR 0008 · 彻底移除插件': architecture/0008-plugin-purge.md
  - 发行:
      - 发行入口: release/README.md
      - 自动化 Release: release/automation.md
      - 插件发布: release/plugins.md
      - 安全与依赖升级: release/security-updates.md
      - 依赖审查: release/dependency-audit.md
      - 项目审查与文档维护: release/project-review.md
  - 兼容性:
      - 验证记录: compatibility/README.md
      - 平台矩阵: release/platforms.md
      - SnowLuma 专项: compatibility/snowluma.md
