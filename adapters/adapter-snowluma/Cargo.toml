[package]
name = "adapter-snowluma"
default-run = "adapter-snowluma"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
twintail-plugin-sdk = { path = "../../crates/twintail-plugin-sdk" }
twintail-onebot11 = { path = "../../crates/twintail-onebot11" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio.workspace = true
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
url = "2"
# tungstenite TRACE serializes handshake headers, including Authorization.
# Compile those sites out in every profile, even if an embedding app enables logs.
log = { version = "0.4", features = ["max_level_info", "release_max_level_info"] }

[lints]
workspace = true

# Integration fixture builds the real business plugin as a separate process.
[[bin]]
name = "p4-echo-fixture"
path = "../../examples/echo-plugin/src/main.rs"

[dev-dependencies]
twintail-core = { path = "../../crates/twintail-core" }
tempfile = "3"
toml = "0.9"
